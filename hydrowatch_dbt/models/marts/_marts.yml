version: 2

models:
  - name: mart_station_daily
    description: "Daily UTC min, max, mean, and count by station and parameter."
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: parameter_code
        data_tests: [not_null]
      - name: calendar_date
        data_tests: [not_null]
      - name: observation_count
        data_tests: [not_null]

  - name: mart_observation_anomalies
    description: "Exploratory outliers more than 3 sample standard deviations from the prior 20 readings, with at least 8 baseline readings."
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: observed_at
        data_tests: [not_null]
