version: 2

models:
  - name: stg_observations
    description: "Typed USGS observations; repeated RAW snapshots remain visible."
    columns:
      - name: monitoring_location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stations')
                field: station_id
      - name: parameter_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_parameters')
                field: parameter_code
      - name: observed_at
        data_tests: [not_null]
      - name: measurement_value
        data_tests: [not_null]

  - name: stg_stations
    description: "Monitoring locations with selected attributes extracted from JSONB."
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: station_name
        data_tests: [not_null]

  - name: stg_parameters
    description: "Parameter names, measurement units, and definitions from JSONB."
    columns:
      - name: parameter_code
        data_tests: [not_null]
      - name: parameter_name
        data_tests: [not_null]
