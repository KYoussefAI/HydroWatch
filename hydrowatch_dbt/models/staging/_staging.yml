version : 2

models:
  - name : stg_parameters
    description: "Cleaned USGS measurement parameter definitions."
  
    columns:
      - name : parameter_code
        data_tests :
          - not_null

      - name : parameter_name
        data_tests :
          - not_null

  - name : stg_observations
    description : "Cleaned USGS measurement observations definitions."

    columns:
      - name: monitoring_location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stations')
                field: station_id

      - name : observed_at
        data_tests:
          - not_null

      - name : measurement_value
        data_tests:
          - not_null

      - name: parameter_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_parameters')
                field: parameter_code


  - name : stg_stations
    description : "Cleaned USGS measurement stations definitions."

    columns:
      - name : station_id
        data_tests:
          - not_null

      - name : station_name
        data_tests:
          - not_null